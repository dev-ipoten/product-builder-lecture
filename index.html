
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Lotto Number Generator</h1>
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="checkbox">
                <input type="checkbox" id="checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
        <div class="lotto-numbers">
            <div class="number-placeholder"></div>
            <div class="number-placeholder"></div>
            <div class="number-placeholder"></div>
            <div class="number-placeholder"></div>
            <div class="number-placeholder"></div>
            <div class="number-placeholder"></div>
        </div>
        <button id="generate-btn">Generate Numbers</button>
        <div class="previous-numbers">
            <h2>Previous Numbers</h2>
            <ul id="previous-list"></ul>
        </div>

        <div class="contact-form">
            <h2>Partnership Inquiry</h2>
            <form action="https://formspree.io/f/xgolknyz" method="POST">
                <label>
                    Your name:
                    <input type="text" name="name" required>
                </label>
                <label>
                    Your email:
                    <input type="email" name="email" required>
                </label>
                <label>
                    Your message:
                    <textarea name="message" required></textarea>
                </label>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
